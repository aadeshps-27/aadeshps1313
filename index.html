      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aadesh-portfolio-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
          var savedLang = localStorage.getItem('aadesh-portfolio-lang');
          if (savedLang === 'ml' || savedLang === 'en') {
            document.documentElement.lang = savedLang;
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

  <body class="bg-white text-[#0A0A0A] dark:bg-black dark:text-white antialiased selection:bg-[#FF721A] selection:text-[#0A0A0A]">
